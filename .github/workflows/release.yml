name: Release

# A manual run keeps installers as artifacts. Tags create one draft after every platform passes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            bundles: nsis
          - name: Linux x64 (experimental)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bundles: appimage,deb
          - name: macOS Apple Silicon (experimental)
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            bundles: dmg
          - name: macOS Intel (experimental)
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      SIGN: ${{ matrix.platform == 'windows' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match version $version."
            exit 1
          fi
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Backend tests
        run: cargo test --lib --locked --target ${{ matrix.target }}
        working-directory: src-tauri
      - name: Rust checks
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
        working-directory: src-tauri
      - name: Build installers
        env:
          NO_STRIP: "true"
        run: npm run tauri build -- --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Headless UI checks
        if: matrix.platform == 'windows'
        run: |
          node tools/headless/regress.mjs
          node tools/headless/platforms.mjs
          node tools/headless/clients.mjs
      - name: Stage Windows installer for signing
        if: matrix.platform == 'windows'
        id: stage
        run: |
          mkdir -p staging
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*_x64-setup.exe staging/osuflow-setup.exe
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Keep unsigned Windows installer
        if: matrix.platform == 'windows'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned-windows-x64
          path: staging/osuflow-setup.exe
          if-no-files-found: error
      - name: Sign Windows installer (SignPath Foundation)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'osuflow' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.stage.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Check Windows signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/osuflow-setup.exe
          if ($signature.Status -ne 'Valid') { throw "The installer signature is not valid." }
      - name: Stage release installers
        run: |
          mkdir -p release
          version=$(node -p "require('./package.json').version")
          if [ "${{ matrix.platform }}" = "windows" ]; then
            source=staging
            if [ "$SIGN" = "true" ]; then source=signed; fi
            cp "$source/osuflow-setup.exe" "release/osu!flow_${version}_x64-setup.exe"
          else
            find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -exec cp '{}' release/ \;
          fi
      - name: Keep installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  draft-release:
    name: Draft release after all platforms pass
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-installer-*
          merge-multiple: true
          path: release
      - name: Create one draft with every installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          {
            echo "This preview adds a stable/lazer client choice and **experimental** Linux/macOS builds. Linux stable integrates with osu-winello; lazer imports use the native client. Linux/macOS installers are unsigned. Real-game compatibility has not been confirmed by platform testers."
            echo
            echo "Windows: download the x64 setup.exe. Linux: use the AppImage or deb. macOS: choose the Apple Silicon (aarch64) or Intel (x64) dmg; allow the app in System Settings > Privacy & Security > Open Anyway."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "The Windows installer is signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation."
            else
              echo "Windows installers are not code-signed. SmartScreen may require More info > Run anyway."
            fi
            echo
            echo "See [client setup and limitations](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/client-setup.md) for osu-winello, lazer, the Wayland toggle and manual import recovery."
            echo
            echo '```text'
            (cd release && sha256sum *)
            echo '```'
          } > notes.md
          if gh release view "$TAG" --json isDraft > existing.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' existing.json > /dev/null; then
              echo "Refusing to modify an already-published release."
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release/* --draft --prerelease --title "osu!flow $TAG — experimental Linux and client support" --notes-file notes.md
          fi
