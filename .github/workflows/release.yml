name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and attaches it to a draft GitHub release, which
# you review and publish by hand. When SignPath signing is set up (below) the installer is signed first;
# until then the release is simply unsigned.
#
# Running this by hand from the Actions tab builds, tests and (if set up) signs, but releases nothing:
# the installer is left as a downloadable artifact of the run.
#
# Free code signing from the SignPath Foundation. Under Settings > Secrets and variables > Actions:
#   secret    SIGNPATH_API_TOKEN             the API token of the CI user in SignPath
#   variable  SIGNPATH_ORGANIZATION_ID       the organization id shown in SignPath
#   variable  SIGNPATH_PROJECT_SLUG          optional, defaults to osuflow
#   variable  SIGNPATH_SIGNING_POLICY_SLUG   optional, defaults to release-signing
# The artifact configuration to create in SignPath is kept in .github/signpath/artifact-configuration.xml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the draft release
  actions: read # SignPath reads this run to check where the build came from

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Signing switches on once the token and the organization id exist.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG doesn't match version $version in package.json."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Build the installer
        run: npm run tauri build

      # SignPath is given the installer under a fixed name, so its configuration never has to know the version.
      - name: Stage the installer
        id: stage
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir staging
          cp src-tauri/target/release/bundle/nsis/*_x64-setup.exe staging/osuflow-setup.exe
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: staging/osuflow-setup.exe

      - name: Sign the installer (SignPath Foundation)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'osuflow' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.stage.outputs.version }}"
          # Every release is approved by hand in SignPath, so give that time.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/osuflow-setup.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The installer's signature is $($sig.Status), not Valid." }

      - name: Name the installer
        env:
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          source=staging
          if [ "$SIGN" = "true" ]; then source=signed; fi
          mkdir release
          cp "$source/osuflow-setup.exe" "release/osu!flow_${VERSION}_x64-setup.exe"

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$SIGN" = "true" ]; then
            trust="The installer is signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          else
            trust="The installer isn't code-signed, so Windows SmartScreen may say it protects your PC: choose **More info**, then **Run anyway**."
          fi
          {
            echo "Download **osu.flow_..._x64-setup.exe** below and run it. It installs for your user only (no administrator rights) and adds a Start menu entry."
            echo
            echo "$trust"
          } > notes.md
          file=$(ls release/*.exe)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --draft --title "osu!flow $TAG" --notes-file notes.md
          fi
