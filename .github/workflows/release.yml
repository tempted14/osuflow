name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and attaches it to a draft GitHub release,
# which you review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        run: cargo test --lib
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "osu!flow ${{ github.ref_name }}"
          releaseBody: |
            Download **osu.flow_..._x64-setup.exe** below and run it. It installs for your user only (no administrator rights) and adds a Start menu entry.

            The installer isn't code-signed, so Windows SmartScreen may say it protects your PC: choose **More info**, then **Run anyway**.
          releaseDraft: true
          prerelease: false
